[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/model",
    "crates/sim",
    "crates/protocol",
    "crates/shell",
    "crates/testclient",
    "crates/vectors",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.98"

# None of these go to crates.io. They are reached by path inside this workspace, which is also
# what lets the dependency policy tell a path dependency apart from an unpinned public one.
publish = false

[workspace.dependencies]
photo-sync = { path = "crates/shell" }
photo-sync-core = { path = "crates/core" }
photo-sync-model = { path = "crates/model" }
photo-sync-protocol = { path = "crates/protocol" }
photo-sync-sim = { path = "crates/sim" }
photo-sync-testclient = { path = "crates/testclient" }
photo-sync-vectors = { path = "crates/vectors" }

proptest = "1.11.0"
prost = "0.14.4"
prost-build = "0.14.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.26.5"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.23.44"
rustls-pki-types = "1"
rcgen = "0.14.10"
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
x509-parser = "0.18.1"
sha2 = "0.10.9"
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"
