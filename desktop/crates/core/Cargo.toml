[package]
name = "photo-sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# This crate holds the logic and performs no input or output. Adding a dependency that touches
# the filesystem, the network, the clock, or threads breaks the simulator and is not allowed.
[dependencies]
sha2.workspace = true
thiserror.workspace = true

# Deliberately wrong implementations, one at a time, for `./verify self-test`. Each one is a
# rule `SPEC.md` states and the suite claims to enforce. A harness that cannot show it detects
# these has no standing to certify anything, so they live here rather than in a branch nobody
# runs. Only the self-test ever turns one on.
[features]
sabotage-donemark = []
sabotage-watermark = []
sabotage-dedup = []
sabotage-nomination = []
sabotage-seal = []
sabotage-rowsfirst = []
sabotage-clearorder = []
sabotage-halt = []

[lints]
workspace = true
