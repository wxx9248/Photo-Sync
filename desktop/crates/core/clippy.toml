# The core crate must not reach for the platform. See docs/STACK.md section 3.3 and
# docs/VERIFICATION.md section 2, which scope this to the core: the shell exists to make
# exactly these calls, so a rule that reached it would be forbidding the shell its job.
#
# Clippy reads this from the directory of the crate it is checking, so keeping it beside the
# core is what limits it to the core.
disallowed-types = [
    { path = "std::time::SystemTime", reason = "take the time from the Clock port" },
    { path = "std::time::Instant", reason = "take the time from the Clock port" },
]

disallowed-methods = [
    { path = "std::fs::rename", reason = "emit an Effect and let the shell perform it" },
    { path = "std::fs::remove_file", reason = "emit an Effect and let the shell perform it" },
]
