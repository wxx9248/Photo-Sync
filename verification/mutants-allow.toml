# Mutants the suite does not kill, each with the reason a test would not be worth writing.
#
# The done gate in AGENTS.md requires every surviving mutant to be killed or listed here.
# An entry is a claim that the mutated behavior is unobservable to the specification, not
# that the code is hard to test. Anything that changes what the desktop does belongs in a
# test instead.

[[allow]]
file = "desktop/crates/core/src/desktop.rs"
function = "Desktop::needs_commit_path"
reason = "The placeholder answer for steps the commit sequence has not reached yet; it disappears with the next change."

[[allow]]
file = "desktop/crates/core/src/desktop.rs"
function = "describe"
reason = "Wording of a log line naming the phase a phone interrupted. Asserting on it would test the sentence, not the decision."

[[allow]]
file = "desktop/crates/core/src/desktop/commit.rs"
function = "describe_step"
reason = "Wording of the log line naming where a commit stopped. The tests assert that it stopped and what survived, which is what a reader acts on."

[[allow]]
file = "desktop/crates/core/src/digest.rs"
function = "RunningDigest::fmt"
reason = "Debug rendering of the running digest. The digest itself is checked against the published SHA-256 vectors."
