# The machine-readable projection of docs/SPEC.md.
#
# Every entry quotes the specification verbatim. `./verify spec-check` compares the quote after
# collapsing whitespace, so a reworded clause fails the build until someone confirms whether the
# meaning changed and updates both files together.
#
# status = "deferred" means no test is expected yet. A milestone in docs/ROADMAP.md flips the
# requirements it closes to "active", after which a requirement without a passing test fails the
# full tier.

