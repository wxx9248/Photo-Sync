  <rect x="4" y="10" width="16" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="26" y="12" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M30 30h10M35 26v8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="12" cy="21" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M20 24h7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
