# The Android and Compose toolchains are memory-hungry, and a daemon that runs out of
# metaspace fails the build with an error about the garbage collector rather than about
# anything a person did.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9 wants this stated rather than assumed.
android.useAndroidX=true

# The development machine has no GPU, so the managed device renders in software. Without this
# the emulator refuses to start and the failure reads as a graphics feature flag rather than
# as a missing display.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
